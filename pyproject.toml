[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftopdfa"
version = "0.9.2"
description = "Convert PDF files to the archival PDF/A format"
readme = "README.md"
license = "MPL-2.0+"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "iredpaul"}
]
keywords = ["pdf", "pdfa", "pdf-a", "archival", "conversion", "iso-19005"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "pikepdf>=10.9.1,<11",
    "lxml>=6.1.1",
    "click>=8.4.2",
    "colorama>=0.4.6",
    "tqdm>=4.68.3",
    "fonttools>=4.63.0",
    "pdfminer.six>=20260107",
    "numpy>=1.24,<2.4",
    "paddleocr>=3.7.0,<3.8",
]

[project.urls]
Homepage = "https://github.com/iredpaul/pdftopdfa"
Repository = "https://github.com/iredpaul/pdftopdfa"
Issues = "https://github.com/iredpaul/pdftopdfa/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
ocr = [
    "ocrmypdf==17.8.1",
    "onnxruntime==1.27.0",
    "paddleocr==3.7.0",
    "paddlex[ocr]==3.7.2",
    "pypdfium2>=5.11.0",
]
directml = [
    "ocrmypdf==17.8.1",
    "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
    "paddleocr==3.7.0",
    "paddlex[ocr]==3.7.2",
    "pypdfium2>=5.11.0",
]

[project.scripts]
pdftopdfa = "pdftopdfa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdftopdfa = [
    "resources/icc/*.icc",
    "resources/icc/LICENSES.txt",
    "resources/fonts/*.ttf",
    "resources/fonts/*.otf",
    "resources/fonts/*.ttc",
    "resources/fonts/LICENSES.txt",
    "resources/cid_unicode/*.bin.gz",
    "resources/cid_unicode/LICENSES.txt",
    "resources/models/PP-LCNet_x1_0_doc_ori/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=pdftopdfa --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "FURB110",
    "FURB188",
    "I",
    "N",
    "PERF102",
    "PERF401",
    "PERF403",
    "RUF100",
    "SIM101",
    "SIM103",
    "SIM201",
    "UP",
    "W",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pdftopdfa"]
